name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate metrics.svg
        run: npm start
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_USER: Ishi-eenn
          # Section order — reorder / drop whole sections (omit a name to hide it).
          METRICS_ORDER: header,activity,languages
          # Activity rows — reorder / drop individual rows.
          METRICS_ACTIVITY: commits,reviews,prs,issues,comments

      - name: Stage output
        run: |
          mkdir -p public
          cp metrics.svg public/metrics.svg

      # Publish the SVG to a branch so it can be viewed directly via a raw URL:
      #   main / scheduled -> metrics-output  (production; referenced by the profile)
      #   PRs / other refs -> metrics-preview (throwaway preview of that build)
      # `single-commit` keeps each branch at exactly one commit (no history buildup),
      # and main itself is never modified by the bot.
      - name: Publish SVG
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ github.ref == 'refs/heads/main' && 'metrics-output' || 'metrics-preview' }}
          folder: public
          single-commit: true
          commit-message: "chore: update metrics.svg (${{ github.head_ref || github.ref_name }})"
