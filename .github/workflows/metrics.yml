name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate metrics.svg
        run: npm start
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_USER: Ishi-eenn

      # PRs / test branches: expose the result as an artifact for inspection,
      # but never publish — main stays untouched and its history stays clean.
      - name: Upload preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: metrics-svg
          path: metrics.svg

      # main / scheduled runs: publish the SVG to the dedicated output branch.
      # `single-commit` keeps metrics-output at exactly one commit (no history
      # buildup), and main itself is never modified by the bot.
      - name: Stage output
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          cp metrics.svg public/metrics.svg

      - name: Publish to metrics-output
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: metrics-output
          folder: public
          single-commit: true
          commit-message: "chore: update metrics.svg"
